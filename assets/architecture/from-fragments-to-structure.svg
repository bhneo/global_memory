<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 90 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">From fragments to hidden structure</title>
  <desc id="desc">Papers, conversations, experiments and ideas enter evolving memory, organize into research directions, reveal patterns, tensions and open questions, and may form a qualified cross-field candidate with a verification path.</desc>
  <defs>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17347a"/>
      <stop offset="1" stop-color="#08a6d8"/>
    </linearGradient>
    <linearGradient id="candidate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#edf4ff"/>
      <stop offset="1" stop-color="#e5fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17347a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2957b8"/>
    </marker>
    <style>
      .label{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#13254b;text-anchor:middle}
      .small{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#53627a;text-anchor:middle}
      .inverse{fill:#fff}
      .card{fill:#fff;stroke:#b8c9e8;stroke-width:2}
      .line{fill:none;stroke:#2957b8;stroke-width:3;marker-end:url(#arrow)}
      .soft{fill:none;stroke:#65bfe1;stroke-width:2.5}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#fbfdff"/>
  <g filter="url(#shadow)">
    <rect class="card" x="70" y="112" width="230" height="92" rx="18"/>
    <rect class="card" x="340" y="112" width="230" height="92" rx="18"/>
    <rect class="card" x="630" y="112" width="230" height="92" rx="18"/>
    <rect class="card" x="900" y="112" width="230" height="92" rx="18"/>
  </g>
  <text x="185" y="148" class="label">Papers</text><text x="185" y="177" class="small">claims · methods · evidence</text>
  <text x="455" y="148" class="label">Conversations</text><text x="455" y="177" class="small">decisions · changed views</text>
  <text x="745" y="148" class="label">Experiments</text><text x="745" y="177" class="small">results · failures · anomalies</text>
  <text x="1015" y="148" class="label">Ideas</text><text x="1015" y="177" class="small">questions · intuitions</text>

  <path class="line" d="M185 204C185 242 408 238 490 270"/><path class="line" d="M455 204C455 236 505 242 536 268"/>
  <path class="line" d="M745 204C745 236 695 242 664 268"/><path class="line" d="M1015 204C1015 242 792 238 710 270"/>

  <g filter="url(#shadow)"><rect x="425" y="270" width="350" height="110" rx="30" fill="url(#memory)"/></g>
  <text x="600" y="329" class="label inverse" font-size="26">Evolving memory</text><text x="600" y="357" class="small inverse">sources · provenance · belief history · relations</text>
  <path class="line" d="M600 380v42"/>
  <rect x="430" y="423" width="340" height="66" rx="33" fill="#edf4ff" stroke="#2957b8" stroke-width="2"/>
  <text x="600" y="463" class="label">Research directions</text>

  <path class="soft" d="M600 489v22M600 511H240v35M600 511v35M600 511h360v35"/>
  <g filter="url(#shadow)">
    <rect class="card" x="90" y="546" width="300" height="100" rx="20"/><rect class="card" x="450" y="546" width="300" height="100" rx="20"/><rect class="card" x="810" y="546" width="300" height="100" rx="20"/>
  </g>
  <text x="240" y="585" class="label">Patterns</text><text x="240" y="615" class="small">recurring mechanisms</text>
  <text x="600" y="585" class="label">Tensions</text><text x="600" y="615" class="small">contradictions · boundaries</text>
  <text x="960" y="585" class="label">Open questions</text><text x="960" y="615" class="small">unknowns worth testing</text>

  <path class="soft" d="M240 646c0 38 164 18 220 48M600 646v34M960 646c0 38-164 18-220 48"/>
  <g filter="url(#shadow)"><rect x="330" y="680" width="540" height="64" rx="32" fill="url(#candidate)" stroke="#08a6d8" stroke-width="2"/></g>
  <text x="600" y="707" class="label">Qualified cross-field candidate</text>
  <text x="600" y="731" class="small">shared mechanism · boundary · difference · verification path</text>
</svg>
