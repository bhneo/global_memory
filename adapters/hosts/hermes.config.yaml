mcp_servers:
  galois:
    command: "{{GALOIS_PYTHON}}"
    args:
      - "-m"
      - "global_memory"
      - "mcp"
      - "stdio"
    env:
      PYTHONPATH: "{{GALOIS_ROOT}}\\src"
      GALOIS_ROOT: "{{GALOIS_ROOT}}"
    tools:
      include:
        - memory_capabilities
        - memory_context
        - memory_search
        - memory_show
        - memory_source
