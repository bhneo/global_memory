[mcp_client]
enabled = true

[[mcp_client.servers]]
name = "galois"
description = "Governed long-term evidence memory (read-only)"
command = "{{GALOIS_PYTHON}}"
args = ["-m", "global_memory", "mcp", "stdio"]
env = { PYTHONPATH = "{{GALOIS_ROOT}}\\src", GALOIS_ROOT = "{{GALOIS_ROOT}}" }
cwd = "{{GALOIS_ROOT}}"
enabled = true
allowed_tools = ["memory_capabilities", "memory_context", "memory_search", "memory_show", "memory_source"]
disallowed_tools = []
timeout_secs = 60
