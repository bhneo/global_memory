[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-memory-local"
version = "0.26.1"
description = "Local-first, model-independent personal knowledge infrastructure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
pdf = ["pypdf>=5,<7"]
lint = ["ruff>=0.12,<1", "pyright>=1.1,<2", "pytest-cov>=6,<7"]

[project.scripts]
galois = "global_memory.cli:main"
# Deprecated compatibility alias. Public documentation and new integrations
# use `galois` exclusively.
gm = "global_memory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["vault", "data", "artifacts", "artifacts-local", ".ci-vault*"]

[tool.ruff.lint]
select = ["F", "B904"]
ignore = ["E501"]

[tool.pyright]
include = [
  "src/global_memory/capture_policy.py",
  "src/global_memory/secure_fetch.py",
  "src/global_memory/writer_lock.py",
  "src/global_memory/context.py",
]
exclude = ["vault", "data", "artifacts", "artifacts-local", ".ci-vault*"]
typeCheckingMode = "basic"
reportMissingImports = "none"
